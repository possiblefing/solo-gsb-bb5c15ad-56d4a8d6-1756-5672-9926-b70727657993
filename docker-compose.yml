services:
  story-checker:
    build: .
    image: branching-story-checker:latest
    container_name: branching-story-checker
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      # 容器内监听端口（一般无需修改）
      PORT: 3000
      # 剧情数据 JSON 的存放目录
      DATA_DIR: /app/data
    volumes:
      # 数据持久化到宿主机 ./data，删除容器不丢剧情
      - story-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/stories"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  story-data:
